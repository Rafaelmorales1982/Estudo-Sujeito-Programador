<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>CSS - Seletores - classes e id </title>
  </head>
  <body>

    <!--
      - Usar classe: Selecionar mais de um elemento.
      -Usar id: Selecionar apenas um único item.
    -->


    <h1 class="primeiro-h1">Bem vindo ao meu projeto!</h1>

    <h1 id="titulo">Olá mundo!</h1>

    <h1 class="primeiro-h1">Criando mais um título tipo h1</h1>

    <h2 class="primeiro-h2">Título do tipo h2</h2>

  </body>
</html>
