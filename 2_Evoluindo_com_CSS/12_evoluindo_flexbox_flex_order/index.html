<!doctype html>
<!-- Documento HTML5 configurado para português do Brasil -->
<html lang="pt-br">
  <head>
    <!-- Codificação de caracteres (acentos) e responsividade da página -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Fonts: importa a fonte Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <!-- Conecta o arquivo de estilos externo -->
    <link rel="stylesheet" href="./style.css" />
    <title>CSS - Flexbox</title>
  </head>
  <body>

    <!-- Container Flex: agrupa e organiza os itens -->
    <div class="container">
      <!-- Cada div abaixo é um Flex Item -->
      <div class="area item-1">1</div>
      <div class="area item-2">2</div>
      <div class="area item-3">3</div>
    </div>

 
  


  
  </body>
</html>
