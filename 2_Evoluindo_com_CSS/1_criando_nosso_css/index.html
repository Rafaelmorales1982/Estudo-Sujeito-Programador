<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./style.css" />
    <title>Inciando CSS</title>

    <style>
      h2 {
        color: green;
      }

    </style>
  </head>
  <body>
    <!--
      1. Inline CSS - Direto no nosso html, ou na tag. (não é uma boa prática).
      2. CSS Interno - Direto no seu html na tag Style. (não é uma boa prática)
      3. CSS Externo - Criar um arquivo separado .css com seu estilo.(Melhor opção)
    -->

    <!--CSS inline-->
    <h1 style="color: red; font-size: 24px;"> Bem vindo ao meu projeto!!</h1>

    <!--CSS interno-->
    <h2>CSS Interno</h2>

    <!--CSS externo style.css-->
    <h3>CSS externo</h3>
    <h3>CSS externo 2</h3>

  </body>
</html>
