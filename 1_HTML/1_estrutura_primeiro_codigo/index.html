<!-- ============================================
     MEU PRIMEIRO PROJETO EM HTML
     Arquivo: index.html
     ============================================ -->

<!-- <!DOCTYPE html> avisa ao navegador que este documento usa HTML5 -->
<!DOCTYPE html>

<!-- <html> é a tag raiz: tudo fica dentro dela.
     lang="pt-BR" informa que o conteúdo está em português do Brasil -->
<html lang="pt-BR">

<!-- <head> guarda informações sobre a página (metadados).
     Nada aqui aparece diretamente na tela. -->
<head>

  <!-- charset="UTF-8" permite acentos, ç e caracteres especiais -->
  <meta charset="UTF-8">

  <!-- viewport faz o site se adaptar à largura da tela (celular, tablet, PC) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- <title> é o texto que aparece na aba do navegador -->
  <title>Primeiro Projeto</title>

</head>

<!-- <body> é o corpo da página: tudo aqui aparece para o usuário -->
<body>

  <!-- <h1> é o título principal (o mais importante, use um por página) -->
  <h1>Meu primeiro projeto aqui!</h1>

  <!-- <h2> é um subtítulo, um nível abaixo do h1 -->
  <h2>Bem vindo ao curso</h2>

  <!-- <br> quebra a linha. Dois seguidos criam um espaço maior.
       Obs.: para espaçamento, o ideal depois é usar CSS. -->
  <br><br>

  <!-- <p> cria um parágrafo de texto -->
  <p>Estou criando meu primeiro projeto com html....</p>

  <!-- Outra quebra de linha -->
  <br>

  <!-- Cada <br> dentro do <p> inicia uma nova linha no mesmo parágrafo -->
  <p>Esse é um parágrafo do meu site <br>
    quero que ele quebre essa minha linha. <br>
    Terceira linha para testar.
  </p>

</body>

</html>
