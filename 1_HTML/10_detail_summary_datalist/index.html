<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trabalhando com Detail/Summary e datalist</title>
  </head>
  <body>
   

    <!--Criando acordeão em HTML utilizando Detail e Summary-->
    <!--
    -O nome acordeão (em inglês, accordion) vem de uma comparação visual com o instrumento musical (a sanfona/acordeão): assim como o fole do instrumento abre e fecha ao ser esticado e comprimido, esse elemento na tela expande e recolhe o conteúdo quando você clica nele.
    
    -Na prática, é aquele componente clássico de Perguntas Frequentes (FAQ) que você vê em quase todos os sites:

    -Fechado: Aparece apenas uma lista de perguntas ou títulos (geralmente com uma setinha ▼ ou sinal de + do lado).

    -Aberto: Quando você clica em uma pergunta, o bloco "estica" para baixo revelando a resposta, empurrando os itens de baixo para dar espaço. Quando você clica de novo, ele fecha.
  
  -->
  <h1>Trabalhando com Detail/ Summary e datalist</h1>
  <details open>
    <summary>Motor 1.6</summary>
    <p>O carro possui um motor super forte e rápido...</p>
  </details>

  <br>

  <details>
    <summary>Conforto</summary>
    <p>Carro de luxo com sensor de ré, câmeras e som de qualidade...</p>
  </details>

  <br>

  <details>
    <summary>Preço</summary>
    <p>12X de R$1.000</p>
  </details>

<hr>
<br><br>

<h2>Aplicando datalist</h2>

<form action="">
  <input list="carros" placeholder="Procurando algum carro">
  <datalist id="carros">
    <option value="Gol 1.0"></option>
    <option value="Golf 1.4"></option>
    <option value="BMW 2.0"></option>
    <option value="Onix 1.0"></option>
  </datalist>
</form>

</body>
</html>
