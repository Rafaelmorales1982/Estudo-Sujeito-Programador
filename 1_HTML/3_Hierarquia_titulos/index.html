<!-- ============================================
     HIERARQUIA DE TÍTULOS
     Arquivo: index.html
     ============================================ -->

<!-- <!DOCTYPE html> avisa ao navegador que este documento usa HTML5 -->
<!DOCTYPE html>

<!-- <html> é a tag raiz. lang="pt-BR" define o idioma da página -->
<html lang="pt-BR">

<!-- <head> contém os metadados (informações que não aparecem na tela) -->
<head>

  <!-- charset="UTF-8" permite acentos, ç e caracteres especiais -->
  <meta charset="UTF-8">

  <!-- viewport ajusta o site ao tamanho da tela (responsividade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- <title> é o texto exibido na aba do navegador -->
  <title>Hierarquia de títulos</title>

</head>

<!-- <body> é o conteúdo visível da página -->
<body>

  <!-- ============================================
       HIERARQUIA DOS TÍTULOS (h1 até h6)
       Os títulos vão do mais importante (h1)
       para o menos importante (h6), assim:

       h1 → título principal da página (use só um)
        └ h2 → seção
           └ h3 → subseção
              └ h4 → sub-subseção
                 └ h5
                    └ h6

       Importante: não pule níveis (ex.: h1 direto
       para h4). O tamanho da fonte pode ser mudado
       com CSS, mas a hierarquia do conteúdo não.
       ============================================ -->

  <!-- <h1> é o título principal da página (o mais importante) -->
  <h1>Aprendendo sobre títulos</h1>

  <!-- <h2> é um subtítulo: cria uma seção dentro do h1 -->
  <h2>Introdução</h2>

  <!-- <h3> é uma subseção: fica dentro do h2 acima -->
  <h3>O que é HTML</h3>
  <p>Aqui é um exemplo do que é html testando aqui..</p>

  <!-- Outro <h3>: mesma seção "Introdução", outro assunto -->
  <h3>Conhecendo o curso</h3>
  <p>Aqui é um exemplo do que é html testando aqui</p>

  <!-- <h4> é um nível abaixo do h3 (sub-subtítulo) -->
  <h4>Título h4</h4>

  <!-- <h5> é um nível abaixo do h4 -->
  <h5>Título h5</h5>

  <!-- <h6> é o menor nível de título -->
  <h6>Título h6</h6>

</body>

</html>
