<!-- ============================================
     TRABALHANDO COM IMAGENS
     Arquivo: index.html
     ============================================ -->

<!-- <!DOCTYPE html> avisa ao navegador que este documento usa HTML5 -->
<!DOCTYPE html>

<!-- <html> é a tag raiz. lang="pt-BR" define o idioma da página -->
<html lang="pt-BR">

<!-- <head> contém os metadados (informações que não aparecem na tela) -->
<head>

  <!-- charset="UTF-8" permite acentos, ç e caracteres especiais -->
  <meta charset="UTF-8">

  <!-- viewport ajusta o site ao tamanho da tela (responsividade) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- <title> é o texto exibido na aba do navegador -->
  <title>Trabalhando com imagens</title>

</head>

<!-- <body> é o conteúdo visível da página -->
<body>

  <!-- <h1> é o título principal da página -->
  <h1>Trabalhando com imagens</h1>

  <!-- <br> quebra a linha -->
<br>

  <!-- <hr> desenha uma linha horizontal, usada para separar seções -->
<hr>

  <!-- <h2> é um subtítulo (nível abaixo do h1) -->
<h2>Minhas imagens</h2>

  <!-- <p> é um parágrafo de texto -->
<p>Imagem de um programador</p>

  <!-- <img> exibe uma imagem:
       width e height definem largura e altura (em pixels)
       src="./img/programador.png" é o caminho da imagem (pasta img ao lado deste arquivo)
       alt descreve a imagem (acessibilidade e caso a imagem não carregue) -->
<img width="250" height="200" src="./img/programador.png" alt="Imagem de programador">

  <!-- Linha horizontal separando as imagens -->
<hr>

  <!-- Parágrafo descrevendo a próxima imagem -->
<p>Segunda Imagem</p>

  <!-- Imagem local dentro da pasta img -->
<img width="250" height="200" src="./img/metro.png" alt="Imagem de um metro">

  <!-- Parágrafo com o nome da pessoa da imagem -->
<p>Steve Jobs</p>

  <!-- Aqui o src usa uma URL completa: a imagem vem da internet, não do projeto -->
<img width="300" height="270" src="https://s.rfi.fr/media/display/303ecca6-10d6-11ea-abde-005056bf7c53/w:1280/p:1x1/steve%20jobs_0.jpg" alt="Imagem Steve Jobs">

</body>

</html>
